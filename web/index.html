  <!-- ── Structured Data — Organisation ───────────────────────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Trade Kosh",
    "url": "https://tradekosh.com/",
    "logo": "https://tradekosh.com/icons/Icon-512.png",
    "description": "Trade Kosh is a modern trading platform offering Stocks, Futures & Options, MCX Commodities, Real-Time Charts, Portfolio Tracking, Risk Management and Advanced Trading Tools.",
    "sameAs": [],
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "customer support",
      "availableLanguage": ["English", "Hindi"]
    }
  }
  </script>

  <!-- ── Structured Data — WebSite with SearchAction ─────────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Trade Kosh",
    "url": "https://tradekosh.com/",
    "description": "Zero brokerage trading platform for Indian Stocks, F&O, MCX and ETFs with real-time charts, portfolio tracking and advanced risk management.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://tradekosh.com/app/dashboard?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- ── Structured Data — WebApplication ─────────────────────────────────── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Trade Kosh",
    "url": "https://tradekosh.com/",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "Web, Android, iOS",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "INR"
    },
    "featureList": [
      "Real-time stock market data",
      "Futures and Options trading",
      "MCX commodities trading",
      "Portfolio tracking and management",
      "Advanced charting with technical indicators",
      "Risk management system",
      "NSE and BSE market data",
      "Options chain analysis",
      "Paper trading simulation"
    ]
  }
  </script>

  <!-- ── Web Splash (shown while Flutter engine boots) ───────────────────── -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #FAFAFA; }
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #FAFAFA;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    .splash-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #1A3A6B, #387ED1);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(41,98,255,0.22);
    }
    .splash-logo svg { width: 32px; height: 32px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .splash-title {
      color: #111111; font-size: 24px; font-weight: 700;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      letter-spacing: -0.4px; margin-bottom: 6px;
    }
    .splash-sub {
      color: #666666; font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin-bottom: 36px;
    }
    .splash-spinner {
      width: 26px; height: 26px;
      border: 2.5px solid rgba(41,98,255,0.15);
      border-top-color: #2962FF;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Single branded splash — visible only while Flutter engine initialises.
       The Flutter SplashScreen route is transparent so there is no double-splash. -->
  <div id="splash">
    <div class="splash-logo">
      <!-- Candlestick chart icon — matches the app icon -->
      <svg viewBox="0 0 24 24">
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
        <polyline points="16 7 22 7 22 13"/>
      </svg>
    </div>
    <div class="splash-title">Trade Kosh</div>
    <div class="splash-sub">Professional Trading Platform</div>
    <div class="splash-spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function() {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 400);
      }
    });
  </script>
  <script>
    // Register FCM service worker before Flutter initialises so that background
    // push messages are handled even before the Flutter engine wakes up.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' })
        .then(function(reg) {
          console.log('[FCM] Service worker registered, scope:', reg.scope);
        })
        .catch(function(e) {
          console.warn('[FCM] Service worker registration failed:', e);
        });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
